skill: github-repo-management
version: "1.0.0"
schema_version: "1.0"
checks:
  - id: trigger
    description: "Skill triggers correctly: fires for repo management tasks, does NOT fire for unrelated tasks"
    weight: 20
  - id: clone
    description: "Clone via HTTPS or gh, supports shallow and branch-specific cloning"
    weight: 5
  - id: create
    description: "Create repos with gh or curl, support private/public/license/template/org"
    weight: 15
  - id: fork
    description: "Fork and clone with upstream remote, sync with upstream"
    weight: 5
  - id: info
    description: "View repo details, list repos, search repos"
    weight: 5
  - id: settings
    description: "Edit description, topics, branch protection"
    weight: 5
  - id: branch
    description: "Set up branch protection rules"
    weight: 5
  - id: secrets
    description: "List and set GitHub Actions secrets safely"
    weight: 10
  - id: release
    description: "Create and list releases"
    weight: 5
  - id: workflow
    description: "List, re-run, and manually trigger workflows"
    weight: 5
  - id: gist
    description: "Create and list gists"
    weight: 5
  - id: pitfall
    description: "Handle SSH default, auth failures, fallbacks gracefully"
    weight: 10
scoring:
  pass_threshold: 70
  excellent_threshold: 90
